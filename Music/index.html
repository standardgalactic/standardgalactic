<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Monitor</title>
<style>
:root{
  --bg:#090b09;
  --panel:#101310;
  --ink:#b8c6ad;
  --dim:#65705f;
  --line:#30372e;
  --glow:#d1dfc5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Courier New",Courier,monospace;
  overflow:hidden;
}
main{
  height:100svh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:18px 22px 16px;
  gap:14px;
}
header,footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  color:var(--dim);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
header{
  border-bottom:1px solid var(--line);
  padding-bottom:10px;
}
footer{
  border-top:1px solid var(--line);
  padding-top:10px;
  font-size:9px;
}
.monitor{
  min-height:0;
  display:grid;
  grid-template-rows:auto 1fr;
  border:1px solid var(--line);
  background:var(--panel);
  box-shadow:inset 0 0 40px #000;
}
.readout{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:20px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.track{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:var(--glow);
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.time{
  color:var(--dim);
  font-variant-numeric:tabular-nums;
  font-size:12px;
}
.scope{
  position:relative;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(#18201855 1px,transparent 1px),
    linear-gradient(90deg,#18201855 1px,transparent 1px),
    #070907;
  background-size:32px 32px;
}
.scope:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    #0002 4px
  );
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.controls{
  display:grid;
  grid-template-columns:48px minmax(0,1fr) minmax(210px,34vw);
  align-items:center;
  gap:12px;
}
button,select{
  font:inherit;
  color:var(--ink);
  background:#0c0f0c;
  border:1px solid var(--line);
}
button{
  height:38px;
  cursor:pointer;
  font-size:15px;
}
button:hover,select:hover{border-color:var(--dim)}
select{
  height:38px;
  min-width:0;
  padding:0 10px;
  outline:none;
}
input[type=range]{
  width:100%;
  accent-color:#87947f;
}
.seekwrap{
  display:grid;
  grid-template-columns:1fr;
  align-items:center;
}
@media(max-width:700px){
  main{padding:12px;gap:10px}
  .controls{grid-template-columns:44px 1fr}
  select{grid-column:1/-1}
  header span:last-child{display:none}
}
</style>
</head>
<body>
<main>
  <header>
    <span>SG AUDIO MONITOR / 01</span>
    <span id="status">READY</span>
  </header>

  <section class="monitor">
    <div class="readout">
      <div class="track" id="name">WHO ONESELF</div>
      <div class="time"><span id="now">0:00</span> / <span id="end">--:--</span></div>
    </div>
    <div class="scope">
      <canvas id="field"></canvas>
    </div>
  </section>

  <section class="controls">
    <button id="play" aria-label="Play or pause">▶</button>
    <div class="seekwrap">
      <input id="seek" type="range" min="0" max="1" step=".01" value="0" aria-label="Seek">
    </div>

<select id="tracks" aria-label="Track">
  <option value="Who Oneself.mp3">Who Oneself</option>
  <option value="death-of-the-mima.mp3">The Death of the Mima</option>
  <option value="Falling Through the Sky.mp3">Falling Through the Sky</option>
  <option value="Falling Through the Sky (Admissibility Remix).mp3">Falling Through the Sky (Admissibility Remix)</option>
  <option value="Lift-me-up-alternate.mp3">Lift-me-up-alternate</option>
  <option value="Lift-Me-Up.mp3">Lift-Me-Up</option>
  <option value="More Than What The Earth Can.mp3">More Than What The Earth Can</option>
  <option value="One More Level.mp3">One More Level</option>
  <option value="Rydberg-State-Coda-enhanced.mp3">Rydberg State Coda enhanced</option>
  <option value="Rydberg-State-Coda-rock-opera.mp3">Rydberg State Coda rock-opera</option>
  <option value="The Difference That Remains.mp3">The Difference That Remains</option>
  <option value="The Difference That Remains (Shoegaze Reprise).mp3">The Difference That Remains (Shoegaze Reprise)</option>
  <option value="صرخة في الضباب.mp3">صرخة في الضباب</option>
</select>

  </section>

  <footer>
    <span>FLYXION / MUSIC</span>
    <span>TIME DOMAIN SIGNAL</span>
  </footer>

  <audio id="audio" preload="metadata"></audio>
</main>

<script>
const audio = document.querySelector('#audio');
const playBtn = document.querySelector('#play');
const seek = document.querySelector('#seek');
const selector = document.querySelector('#tracks');
const nameEl = document.querySelector('#name');
const nowEl = document.querySelector('#now');
const endEl = document.querySelector('#end');
const statusEl = document.querySelector('#status');

let audioCtx, analyser, sourceNode;
const waveData = new Uint8Array(2048);

const fmt = s => {
  if (!Number.isFinite(s)) return '--:--';
  return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2,'0');
};

function displayName(filename){
  return filename.replace(/\.mp3$/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
}

function loadTrack(filename, autoplay=false){
  const wasPlaying = !audio.paused;
  audio.src = encodeURI(filename);
  nameEl.textContent = displayName(filename);
  document.title = displayName(filename) + ' — Music Monitor';
  seek.value = 0;
  nowEl.textContent = '0:00';
  endEl.textContent = '--:--';
  statusEl.textContent = 'LOADING';
  audio.load();
  if (autoplay || wasPlaying) {
    audio.play().catch(() => {});
  }
}

function connectAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = .72;
  sourceNode = audioCtx.createMediaElementSource(audio);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

playBtn.addEventListener('click', async () => {
  connectAudio();
  await audioCtx.resume();
  if (audio.paused) audio.play().catch(() => statusEl.textContent = 'PLAYBACK ERROR');
  else audio.pause();
});

selector.addEventListener('change', () => loadTrack(selector.value, !audio.paused));

audio.addEventListener('loadedmetadata', () => {
  seek.max = audio.duration || 1;
  endEl.textContent = fmt(audio.duration);
  statusEl.textContent = 'READY';
});

let isSeeking = false;

function previewSeek(){
  const t = Number(seek.value);
  nowEl.textContent = fmt(t);
}

function commitSeek(){
  const t = Number(seek.value);
  if (Number.isFinite(t)) audio.currentTime = t;
  isSeeking = false;
}

seek.addEventListener('pointerdown', () => {
  isSeeking = true;
});

seek.addEventListener('input', () => {
  isSeeking = true;
  previewSeek();
});

seek.addEventListener('change', commitSeek);
seek.addEventListener('pointerup', commitSeek);
seek.addEventListener('pointercancel', () => {
  isSeeking = false;
});

audio.addEventListener('timeupdate', () => {
  if (!isSeeking) seek.value = audio.currentTime;
  nowEl.textContent = isSeeking ? fmt(Number(seek.value)) : fmt(audio.currentTime);
});

audio.addEventListener('play', () => {
  playBtn.textContent = 'Ⅱ';
  statusEl.textContent = 'PLAY';
});

audio.addEventListener('pause', () => {
  playBtn.textContent = '▶';
  statusEl.textContent = audio.ended ? 'END' : 'READY';
});

audio.addEventListener('error', () => {
  statusEl.textContent = 'FILE NOT FOUND';
});

audio.addEventListener('ended', () => {
  const next = selector.selectedIndex + 1;
  if (next < selector.options.length) {
    selector.selectedIndex = next;
    loadTrack(selector.value, true);
  }
});

const canvas = document.querySelector('#field');
const ctx = canvas.getContext('2d');

function draw(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const rw = Math.round(w*dpr), rh = Math.round(h*dpr);
  if (canvas.width !== rw || canvas.height !== rh){
    canvas.width = rw;
    canvas.height = rh;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  if (analyser) analyser.getByteTimeDomainData(waveData);
  else waveData.fill(128);

  ctx.beginPath();
  ctx.strokeStyle = '#a8b9a0';
  ctx.lineWidth = 1.15;
  ctx.globalAlpha = audio.paused ? .55 : .9;

  for(let x=0; x<w; x++){
    const i = Math.floor((x / Math.max(1,w-1)) * (waveData.length-1));
    const y = h/2 + ((waveData[i]-128)/128) * h*.34;
    if(x===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.globalAlpha = .18;
  ctx.beginPath();
  ctx.moveTo(0,h/2+.5);
  ctx.lineTo(w,h/2+.5);
  ctx.stroke();

  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

loadTrack(selector.value);
draw();
</script>
</body>
</html>
