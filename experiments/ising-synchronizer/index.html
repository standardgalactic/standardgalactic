<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>Five-Dimensional Ising Synchronizer</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030806;color:#7dff9a;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.hud{position:fixed;left:16px;top:14px;max-width:470px;padding:12px 14px;border:1px solid #28733b;background:#031009dc;box-shadow:0 0 24px #0f3;line-height:1.45}.hud b{color:#d8ffe1}.small{color:#57a96a;font-size:12px}.controls{position:fixed;left:16px;bottom:14px;padding:8px 11px;border:1px solid #1b5129;background:#020b06d9}button,input{accent-color:#5dff83;background:#07140b;color:#8fffaa;border:1px solid #28733b;font:inherit}button{padding:4px 8px;cursor:pointer}</style></head><body><canvas id='c'></canvas><div class='hud'><b>FIVE-DIMENSIONAL ISING SYNCHRONIZER</b><br><span id='m'></span><div class='small'>Five coupled spin-lattices are projected into colour. Local agreement competes with thermal noise; cross-layer coupling turns separate fields into a synchronized regime.</div></div><div class='controls'>temperature <input id='t' type='range' min='0' max='5' step='.05' value='2.2'> coupling <input id='k' type='range' min='0' max='2' step='.05' value='.65'> <button id='seed'>randomize</button></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),N=96,L=5,t=document.querySelector('#t'),k=document.querySelector('#k'),m=document.querySelector('#m');let a=[];
function reset(){a=Array.from({length:L},()=>Int8Array.from({length:N*N},()=>Math.random()<.5?-1:1))}reset();
function resize(){c.width=N;c.height=N}resize();
function step(){let T=+t.value,K=+k.value;for(let q=0;q<N*N*2;q++){let z=Math.random()*L|0,i=Math.random()*N|0,j=Math.random()*N|0,p=i*N+j,s=a[z][p],h=a[z][((i+1)%N)*N+j]+a[z][((i+N-1)%N)*N+j]+a[z][i*N+(j+1)%N]+a[z][i*N+(j+N-1)%N]+K*(a[(z+1)%L][p]+a[(z+L-1)%L][p]),d=2*s*h;if(d<=0||Math.random()<Math.exp(-d/Math.max(.01,T)))a[z][p]=-s}}
function draw(){step();let im=x.createImageData(N,N),mags=Array(L).fill(0),sync=0;for(let p=0;p<N*N;p++){let sum=0;for(let z=0;z<L;z++){sum+=a[z][p];mags[z]+=a[z][p]}sync+=Math.abs(sum)/L;let v=(sum+L)/(2*L),o=p*4;im.data[o]=30+210*v;im.data[o+1]=255*Math.abs(v-.5)*2;im.data[o+2]=210*(1-v);im.data[o+3]=255}x.putImageData(im,0,0);m.textContent='T='+t.value+'  K='+k.value+'  synchronization='+(sync/(N*N)).toFixed(3);requestAnimationFrame(draw)}draw();document.querySelector('#seed').onclick=reset;c.onclick=e=>{let r=c.getBoundingClientRect(),j=(e.clientX-r.left)/r.width*N|0,i=(e.clientY-r.top)/r.height*N|0;for(let z=0;z<L;z++)for(let di=-5;di<=5;di++)for(let dj=-5;dj<=5;dj++)a[z][((i+di+N)%N)*N+(j+dj+N)%N]=1};
</script></body></html>
