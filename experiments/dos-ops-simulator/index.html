<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOS Ops Simulator</title>
    <link rel="stylesheet" href="dos-ops-simulator.css" />
  </head>
  <body>
    <main class="shell-frame">
      <header class="frame-header">
        <h1>DOS OPS SIMULATOR // C:\\</h1>
      </header>
      <section id="screen" class="screen" aria-live="polite"></section>
      <form id="prompt" class="prompt" autocomplete="off">
        <label for="cmd">C:\\OPS&gt;</label>
        <input id="cmd" name="cmd" type="text" spellcheck="false" />
      </form>
    </main>

    <script src="dos-ops-simulator.js"></script>
  </body>
</html>
