<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>Mandelbrot / Life Boundary Study</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030806;color:#7dff9a;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.hud{position:fixed;left:16px;top:14px;max-width:470px;padding:12px 14px;border:1px solid #28733b;background:#031009dc;box-shadow:0 0 24px #0f3;line-height:1.45}.hud b{color:#d8ffe1}.small{color:#57a96a;font-size:12px}.controls{position:fixed;left:16px;bottom:14px;padding:8px 11px;border:1px solid #1b5129;background:#020b06d9}button,input{accent-color:#5dff83;background:#07140b;color:#8fffaa;border:1px solid #28733b;font:inherit}button{padding:4px 8px;cursor:pointer}</style></head><body><canvas id='c'></canvas><div class='hud'><b>MANDELBROT / LIFE BOUNDARY STUDY</b><br><span id='m'>computing parameter field…</span><div class='small'>The fractal is a parameter-space boundary; the luminous cells are a temporal automaton. They share iteration, not an identity. Click to seed Life. Double-click to zoom. R resets.</div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W=220,H=140,cx=-.55,cy=0,scale=3.2,life,bg,run=0;
function size(){c.width=W;c.height=H;life=new Uint8Array(W*H);render()}
function render(){bg=g.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let cr=cx+(x/W-.5)*scale,ci=cy+(y/H-.5)*scale*H/W,zr=0,zi=0,n=0;while(zr*zr+zi*zi<4&&n<72){let q=zr*zr-zi*zi+cr;zi=2*zr*zi+ci;zr=q;n++}let o=(y*W+x)*4,v=n==72?0:n*3.5;bg.data[o]=v*.18;bg.data[o+1]=v*.48;bg.data[o+2]=v;bg.data[o+3]=255}m.textContent='center '+cx.toFixed(4)+(cy<0?'':' +')+cy.toFixed(4)+'i · span '+scale.toFixed(4)}
function tick(){let b=new Uint8Array(life.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=life[((y+dy+H)%H)*W+(x+dx+W)%W];let p=y*W+x;b[p]=n==3||(life[p]&&n==2)}life=b}
function draw(){g.putImageData(bg,0,0);g.fillStyle='#b8ffc6';for(let p=0;p<life.length;p++)if(life[p])g.fillRect(p%W,(p/W)|0,1,1);if(++run%8==0)tick();requestAnimationFrame(draw)}size();draw();
c.onclick=e=>{let r=c.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*W|0,Y=(e.clientY-r.top)/r.height*H|0;for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++)if(Math.random()<.38)life[((Y+y+H)%H)*W+(X+x+W)%W]=1};
c.ondblclick=e=>{let r=c.getBoundingClientRect();cx+=(e.clientX-r.left)/r.width*scale-scale/2;cy+=((e.clientY-r.top)/r.height-.5)*scale*H/W;scale*=.48;render()};onkeydown=e=>{if(e.key.toLowerCase()=='r'){cx=-.55;cy=0;scale=3.2;life.fill(0);render()}};
</script></body></html>
