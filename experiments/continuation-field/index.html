<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>Continuation Field</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030806;color:#7dff9a;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}.hud{position:fixed;left:16px;top:14px;max-width:470px;padding:12px 14px;border:1px solid #28733b;background:#031009dc;box-shadow:0 0 24px #0f3;line-height:1.45}.hud b{color:#d8ffe1}.small{color:#57a96a;font-size:12px}.controls{position:fixed;left:16px;bottom:14px;padding:8px 11px;border:1px solid #1b5129;background:#020b06d9}button,input{accent-color:#5dff83;background:#07140b;color:#8fffaa;border:1px solid #28733b;font:inherit}button{padding:4px 8px;cursor:pointer}</style></head><body><canvas id='c'></canvas><div class='hud'><b>CONTINUATION FIELD</b><br><span id='m'></span><div class='small'>POP introduces a distinction. REFUSE reverses its admissible motion. BIND couples nearby trajectories. COLLAPSE removes present state but leaves its history visible.</div></div><div class='controls'><button data-op='pop'>POP</button> <button data-op='refuse'>REFUSE</button> <button data-op='bind'>BIND</button> <button data-op='collapse'>COLLAPSE</button></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let P=[],op='pop',bind=false,history=0;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}resize();onresize=resize;
function pop(X,Y,n=18){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=.3+Math.random()*1.3;P.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,h:110+Math.random()*90,rev:false})}}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{op=b.dataset.op;if(op=='collapse'){P=[];history++;}if(op=='bind')bind=!bind});
c.onclick=e=>{let X=e.clientX*devicePixelRatio,Y=e.clientY*devicePixelRatio;if(op=='pop')pop(X,Y);else if(op=='refuse'){P.forEach(p=>{p.vx=-p.vx;p.vy=-p.vy;p.rev=!p.rev})}else if(op=='bind')pop(X,Y,8);else{P=[];history++}};
function frame(){g.fillStyle='rgba(3,8,6,.035)';g.fillRect(0,0,c.width,c.height);for(let i=0;i<P.length;i++){let p=P[i],ax=Math.sin(p.y*.006+performance.now()*.0002)*.015,ay=Math.cos(p.x*.006-performance.now()*.00015)*.015;if(bind&&P.length>1){let q=P[(i+1)%P.length];ax+=(q.x-p.x)*.000025;ay+=(q.y-p.y)*.000025}p.vx+=ax;p.vy+=ay;p.vx*=.997;p.vy*=.997;p.x=(p.x+p.vx+c.width)%c.width;p.y=(p.y+p.vy+c.height)%c.height;g.fillStyle='hsla('+p.h+',100%,70%,.7)';g.fillRect(p.x,p.y,1.5*devicePixelRatio,1.5*devicePixelRatio)}m.textContent='operator '+op.toUpperCase()+' · '+P.length+' active continuations · '+history+' collapsed presents';requestAnimationFrame(frame)}pop(innerWidth*.5*devicePixelRatio,innerHeight*.5*devicePixelRatio,48);frame();
</script></body></html>
