<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computation Without Extraction</title>
<style>
:root{color-scheme:dark;--green:#9bddb0;--dim:#72917b}*{box-sizing:border-box}body{margin:0;background:#030806;color:var(--green);font:15px/1.7 monospace;min-height:100svh;padding:36px 20px}body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#0003 3px 4px)}main{max-width:780px;margin:auto}header{text-align:center}.label{font-size:11px;letter-spacing:.23em;color:var(--dim)}h1{font-size:clamp(24px,5vw,36px);font-weight:normal;line-height:1.3;margin:15px 0 28px}.screen{position:relative;border:1px solid #254434;border-radius:16px;background:radial-gradient(ellipse at center,#0a2015,#020805 75%);overflow:hidden;box-shadow:0 0 45px #16472b22,inset 0 0 35px #000}canvas{display:block;width:100%;height:clamp(180px,34vw,300px)}.screen-label{position:absolute;top:12px;left:16px;font-size:10px;letter-spacing:.15em;color:#729c7e}#subtitle{min-height:112px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 24px 22px;white-space:pre-line;font-size:17px;line-height:1.6;color:#cef1d7}audio{display:block;width:100%;margin:24px 0 10px}#status{color:var(--dim);font-size:11px;text-align:center;min-height:2em}article{border-top:1px solid #203d2c;margin-top:30px;padding-top:20px}a{color:#b1e7c0;text-underline-offset:5px}a:focus-visible{outline:2px solid #b1e7c0;outline-offset:5px}p{color:#98b09f;font:15px/1.8 system-ui,sans-serif;margin-bottom:0}footer{color:#607d69;font-size:10px;text-align:center;margin-top:28px;letter-spacing:.12em}@media(prefers-reduced-motion:reduce){body::after{display:none}}@media(max-width:480px){body{padding:25px 14px}#subtitle{padding:15px;min-height:140px;font-size:16px}}
</style>
</head>
<body><main>
<header><div class="label">AUDIO ESSAY / FLYXION</div><h1>Computation Without Extraction</h1></header>
<div class="screen"><div class="screen-label">COMPUTATION / HEAT / HOUSEHOLD</div><canvas id="scope" aria-hidden="true"></canvas><div id="subtitle" aria-live="off"></div></div>
<audio id="audio" controls preload="metadata" playsinline src="Turning_Home_Furnaces_Into_Supercomputers.mp3"><track id="captions" kind="subtitles" srclang="en" label="English" src="Turning_Home_Furnaces_Into_Supercomputers.vtt">Your browser does not support audio playback.</audio>
<div id="status" role="status">Ready · Loading subtitles</div>
<article><a href="https://standardgalactic.github.io/standardgalactic/computation-without-extraction.pdf" target="_blank" rel="noopener">Read Computation Without Extraction (PDF)</a></article>
<footer>TURNING HOME FURNACES INTO SUPERCOMPUTERS</footer>
</main><script>
'use strict';
const audio=document.getElementById('audio'),captions=document.getElementById('captions'),subtitle=document.getElementById('subtitle'),status=document.getElementById('status'),canvas=document.getElementById('scope'),pen=canvas.getContext('2d');
let subtitleStatus='Loading subtitles',context,analyser,samples,width=0,height=0;
function report(){status.textContent=(audio.error?'Audio unavailable':audio.ended?'Finished':audio.paused?'Ready / paused':'Playing')+' · '+subtitleStatus;}
function updateSubtitles(){const cues=captions.track.activeCues;subtitle.textContent=cues?Array.from(cues,c=>c.getCueAsHTML().textContent).join('\n'):'';}
captions.track.mode='hidden';captions.track.addEventListener('cuechange',updateSubtitles);
captions.addEventListener('load',()=>{subtitleStatus='Subtitles ready';updateSubtitles();report();});captions.addEventListener('error',()=>{subtitleStatus='Subtitles unavailable';report();});
// Audio playback remains available if Web Audio is unsupported.
async function enableSignal(){try{if(!context){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;context=new AudioContext();analyser=context.createAnalyser();analyser.fftSize=2048;samples=new Uint8Array(analyser.fftSize);const source=context.createMediaElementSource(audio);source.connect(analyser);analyser.connect(context.destination);}if(context.state==='suspended')await context.resume();}catch(error){console.warn('Signal display unavailable',error);}}
audio.addEventListener('pointerdown',enableSignal);audio.addEventListener('keydown',enableSignal);audio.addEventListener('play',()=>{enableSignal();report();});['pause','ended','error'].forEach(e=>audio.addEventListener(e,report));['seeked','timeupdate'].forEach(e=>audio.addEventListener(e,updateSubtitles));
function resize(){const ratio=window.devicePixelRatio||1;width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);pen.setTransform(ratio,0,0,ratio,0,0);}resize();window.addEventListener('resize',resize);
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');let last=0;
function draw(now){requestAnimationFrame(draw);if(now-last<33)return;last=now;pen.clearRect(0,0,width,height);pen.lineWidth=1;pen.strokeStyle='#456b4225';pen.beginPath();for(let x=width/2%32;x<width;x+=32){pen.moveTo(x,0);pen.lineTo(x,height);}for(let y=height/2%32;y<height;y+=32){pen.moveTo(0,y);pen.lineTo(width,y);}pen.stroke();
 const live=analyser&&!audio.paused&&!audio.ended&&!reduced.matches;if(live)analyser.getByteTimeDomainData(samples);
 pen.beginPath();const count=live?samples.length:256;for(let i=0;i<count;i++){const x=16+i/(count-1)*(width-32);const signal=live?(samples[i]-128)/128:0;const envelope=Math.sin(Math.PI*i/(count-1));const y=height/2+signal*height*.40*envelope;if(i===0)pen.moveTo(x,y);else pen.lineTo(x,y);}pen.strokeStyle='#a1f4b4';pen.lineWidth=1.8;pen.shadowColor='#68f28c';pen.shadowBlur=reduced.matches?0:12;pen.stroke();pen.shadowBlur=0;
 pen.fillStyle='#759782';pen.font='10px monospace';pen.fillText('TIME DOMAIN',16,height-14);pen.textAlign='right';pen.fillText(live?'SIGNAL ACTIVE':'SIGNAL IDLE',width-16,height-14);pen.textAlign='left';}
requestAnimationFrame(draw);
</script></body></html>
